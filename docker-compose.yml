services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: evnav_dev_pass
      POSTGRES_DB: evnavigation
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # кэш ответов провайдера маршрутов: только оперативная память, без сохранения на диск
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: evnav_dev_pass
      DB_NAME: evnavigation
      DB_SSLMODE: disable
      SERVER_PORT: 8080
      # секрет и срок токена можно переопределить в .env, не трогая этот файл
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_TTL: ${JWT_TTL:-24h}
      CRITICAL_CHARGE_PERCENT: 15
      ROUTE_PROVIDER: ${ROUTE_PROVIDER:-mock}
      REDIS_URL: redis://redis:6379/0
      ROUTE_CACHE_TTL: ${ROUTE_CACHE_TTL:-30m}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
