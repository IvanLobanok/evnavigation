services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: evnav_dev_pass
      POSTGRES_DB: evnavigation
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: evnav_dev_pass
      DB_NAME: evnavigation
      DB_SSLMODE: disable
      SERVER_PORT: 8080
      JWT_SECRET: dev-secret-change-me
      CRITICAL_CHARGE_PERCENT: 15
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: