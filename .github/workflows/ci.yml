name: CI

on:
  push:
    branches: [main]
  pull_request:

# токену нужно только читать репозиторий
permissions:
  contents: read

# новый коммит в ту же ветку отменяет ещё идущий прогон
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # go.mod/go.sum в порядке, gofmt, golangci-lint, тесты под -race с покрытием.
  # Это тот же `make check`, который запускается локально перед коммитом.
  check:
    name: Проверки и unit-тесты
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod   # версия Go берётся из go.mod

      - name: make check
        run: make check

      - name: Покрытие
        run: |
          {
            echo '### Покрытие тестами'
            echo '```'
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # Интеграционные тесты репозитория: настоящие PostgreSQL + PostGIS и все миграции.
  integration:
    name: Интеграционные тесты (PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: evnav_dev_pass
          POSTGRES_DB: evnavigation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # те же переменные и значения по умолчанию, что в internal/config и Makefile
      DB_HOST: localhost
      DB_PORT: "5432"
      TEST_DATABASE_URL: postgres://postgres:evnav_dev_pass@localhost:5432/evnavigation?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Применить миграции
        run: make migrate-up

      - name: Интеграционные тесты
        run: make test-integration

  # Сборка настоящего образа и проход по API: Dockerfile, миграции при старте,
  # JWT, машины, станции и маршрут целиком.
  e2e:
    name: Docker и smoke-тест
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Поднять БД и приложение
        run: make up   # docker compose up --build -d --wait

      - name: Smoke-тест
        run: make smoke

      - name: Логи контейнеров (если что-то упало)
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Остановить и удалить контейнеры
        if: always()
        run: docker compose down -v

  # Известные уязвимости в зависимостях и стандартной библиотеке.
  # Не блокирует слияние: результат информационный (новые CVE появляются независимо от нашего кода).
  vuln:
    name: Поиск уязвимостей
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: make vuln
